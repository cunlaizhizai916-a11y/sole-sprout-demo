<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>管理画面｜SOLE SPROUT</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#163A16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@800&family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>/* SOLE SPROUT 管理画面 — 玉垣さんがスマホで、ハウスの中で片手で使う前提 */
:root{
  --bg:#F6F2E7; --card:#FFFFFF; --ink:#1E2B1B; --ink2:#5A6656; --line:#E6DFCD;
  --leaf:#2B6324; --leaf-d:#163A16; --sprout:#8DC63F; --tomato:#E0452A; --sun:#F4B23E; --sky:#2F5F96;
  --num:'Shippori Mincho B1','Hiragino Mincho ProN',serif; --jp:'Zen Maru Gothic','Hiragino Sans',sans-serif;
  --top:58px; --tab:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--jp);font-weight:500;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7;letter-spacing:.03em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.n{font-family:var(--num);font-weight:800;letter-spacing:.01em}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}

/* 上のバー */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:var(--leaf-d);color:#FAF5E9}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font-family:'Fraunces',serif;font-size:15px;line-height:1.1;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--sprout);line-height:1.2}
.demo-chip{white-space:nowrap;flex:none;font-size:11.5px;font-weight:700;background:var(--sun);color:var(--leaf-d);padding:2px 10px;border-radius:999px}
.top-link{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:7px 10px;white-space:nowrap;flex:none;border-radius:999px;border:1.5px solid rgba(250,245,233,.4)}
.top-link svg{width:15px;height:15px}
.top-gear{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.top-gear svg{width:24px;height:24px}

/* タブ（スマホは下・PCは左） */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.tabs svg{width:24px;height:24px}
.tabs a.on{color:var(--leaf)}
.tabs a.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--leaf)}
.tab-badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--tomato);color:#fff;font-size:11px;font-family:var(--num);display:grid;place-items:center}
.tab-badge:empty{display:none}
.main{padding:16px 14px calc(var(--tab) + 30px + env(safe-area-inset-bottom));max-width:860px;margin:0 auto}
@media(min-width:900px){
  .tabs{top:var(--top);bottom:0;right:auto;width:200px;height:auto;padding:16px 10px;display:flex;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line)}
  .tabs a{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px}
  .tabs a.on{background:#EEF4E5}
  .tabs a.on::before{display:none}
  .tab-badge{position:static;margin-left:auto}
  .main{margin-left:200px;padding:28px 34px 60px;max-width:none}
  .main>*{max-width:900px}
}

/* 見出し */
.h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 14px}
.h h1{font-size:22px;font-weight:900}
.h small{font-size:13px;color:var(--ink2)}
.sub-h{font-size:15px;font-weight:900;margin:22px 0 10px;color:var(--ink2)}
.lead{font-size:13.5px;color:var(--ink2);margin:-6px 0 14px;line-height:1.7}

/* カード・数字タイル */
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 0 var(--line)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:2px}
.tile small{font-size:12.5px;color:var(--ink2);font-weight:700}
.tile b{font-size:30px;line-height:1.2}
.tile b em{font-style:normal;font-family:var(--jp);font-size:14px;margin-left:3px}
.tile.big{grid-column:1/3;background:var(--leaf);color:#fff;flex-direction:row;align-items:center;justify-content:space-between}
.tile.big small{color:var(--sprout);font-size:14px}
.tile.big b{font-size:44px}
.tile.big .go{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px;background:rgba(255,255,255,.14);padding:10px 14px;border-radius:999px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}.tile.big{grid-column:1/2;flex-direction:column;align-items:flex-start}}

/* 注文の行 */
.olist{display:flex;flex-direction:column;gap:8px}
.orow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 1px 0 var(--line);align-items:center}
.orow .who{font-weight:900;font-size:15.5px;line-height:1.4}
.orow .what{grid-column:1/2;font-size:13px;color:var(--ink2);line-height:1.5}
.orow .meta{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2)}
.orow .amt{font-size:17px;text-align:right}
.orow.sel{outline:3px solid var(--sprout)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;line-height:1.6;white-space:nowrap}
.s-paid{background:#FDE7E2;color:#B5301A}
.s-packed{background:#FFF0D2;color:#8A5A00}
.s-shipped{background:#E3EEF8;color:var(--sky)}
.s-done{background:#EEF4E5;color:var(--leaf)}
.s-canceled,.s-refunded,.s-pending{background:#EEE;color:#777}
.gift{font-size:11px;font-weight:700;color:var(--tomato);border:1.5px solid var(--tomato);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}

/* 絞り込み */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;font-weight:700}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button b{font-family:var(--num);margin-left:4px}
.search{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;margin-bottom:10px}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:900;font-size:15px;white-space:nowrap}
.btn svg{width:20px;height:20px}
.b-green{background:var(--leaf);color:#fff}
.b-red{background:var(--tomato);color:#fff}
.b-line{border:1.5px solid var(--ink)}
.b-ghost{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 6px;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1}

/* 注文の詳細 */
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink2);min-height:44px;margin:-6px 0 4px}
.back svg{width:20px;height:20px}
.dl{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:14.5px}
.dl dt{color:var(--ink2);font-weight:700}
.dl dd{margin:0;word-break:break-all}
.items li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.items li:last-child{border-bottom:0}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:2px solid var(--ink);font-weight:900}
.sum .n{font-size:22px}
.flow{display:flex;gap:4px;margin:4px 0 14px}
.flow span{flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:7px 0;border-radius:8px;background:#EEE9DC;color:var(--ink2)}
.flow span.on{background:var(--leaf);color:#fff}
.flow span.now{box-shadow:0 0 0 2px var(--sun) inset}
.memo{width:100%;min-height:80px;padding:12px;border-radius:12px;border:1.5px solid var(--line);resize:vertical}
.stack{display:flex;flex-direction:column;gap:12px}
.hist{font-size:12.5px;color:var(--ink2)}

/* 発送 */
.selbar{position:sticky;top:calc(var(--top) + 6px);z-index:5;display:flex;align-items:center;gap:8px;background:var(--leaf-d);color:#fff;border-radius:16px;padding:8px 8px 8px 14px;margin-bottom:12px;flex-wrap:wrap}
.selbar b{margin-right:auto;font-size:14px}
.selbar .btn{min-height:42px;padding:0 12px;font-size:13.5px;border-radius:12px}
.selbar .b-line{border-color:rgba(255,255,255,.6);color:#fff}
.selall{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:44px}
.cb{width:24px;height:24px;accent-color:var(--leaf);flex:none}
.shiprow{grid-template-columns:auto 1fr auto}
.shiprow .who,.shiprow .what{grid-column:2/3}
.shiprow .meta{grid-column:2/4}
.shiprow .cb{grid-row:1/3}

/* 在庫 */
.prod{background:var(--card);border-radius:18px;padding:14px 14px 6px;box-shadow:0 1px 0 var(--line);margin-bottom:10px}
.prod h3{font-size:16px;font-weight:900}
.prod .kind{font-size:12px;color:var(--ink2)}
.var{padding:12px 0;border-top:1px solid var(--line);margin-top:10px;display:grid;gap:8px}
.var-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#EEE9DC;border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:42px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on[data-s=on]{background:var(--leaf);color:#fff}
.seg button.on[data-s=pause]{background:var(--sun);color:var(--leaf-d)}
.seg button.on[data-s=end]{background:#666;color:#fff}
.cap{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.cap input{width:84px;min-height:42px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);text-align:center;font-family:var(--num);font-weight:800}
.cap .now{margin-left:auto}
.cap .now.full{color:var(--tomato);font-weight:900}
.note-box{background:#FFF7E3;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.7;margin-bottom:12px}

/* 通知 */
.nlist{display:flex;flex-direction:column;gap:8px}
.nrow{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.nrow header{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.kind{font-size:11px;font-weight:900;padding:1px 8px;border-radius:6px;color:#fff}
.k-line{background:#06C755}.k-mail{background:var(--sky)}
.nrow h3{font-size:15px;font-weight:900;margin:6px 0 4px}
.nrow pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:13px;color:var(--ink2);line-height:1.7;max-height:5.1em;overflow:hidden}
.nrow.open pre{max-height:none}
.nrow button{font-size:12.5px;color:var(--leaf);font-weight:700;margin-top:4px;min-height:32px}

/* フォーム */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:700}
.field input,.field textarea{min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.field.bad input{border-color:#C23A22;background:#FFF6F3}
.err{font-size:12.5px;color:#C23A22;font-weight:700}

/* 空のとき */
.empty{text-align:center;padding:36px 16px;background:var(--card);border-radius:18px}
.empty svg{width:64px;height:64px;margin:0 auto 10px}
.empty b{display:block;font-size:16px;font-weight:900}
.empty p{font-size:13.5px;color:var(--ink2);margin:4px 0 16px}

/* 下から出るシート */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(20,28,18,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.22,.8,.2,1)}
@keyframes up{from{translate:0 100%}}
.sheet h2{font-size:18px;font-weight:900;margin-bottom:6px}
@media(min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;translate:-50% -50%;border-radius:22px;animation:none}}
.trk{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.trk small{font-size:12.5px;color:var(--ink2)}

.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));z-index:50;translate:-50% 16px;opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;transition:.3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;translate:-50% 0}
@media(min-width:900px){.toast{bottom:30px}}
@media(max-width:420px){
  .top{gap:6px}
  .top-link{padding:0;width:40px;height:40px;justify-content:center;border-radius:50%;font-size:0}
  .top-link svg{width:18px;height:18px}
  .top-gear{width:40px;height:40px}
}

/* ログイン */
body.locked .tabs,body.locked .top-gear,body.locked .top-link{display:none}
body.locked .main{margin-left:auto}
.login{max-width:380px;margin:40px auto 0;text-align:center}
.login-mark{width:64px;height:64px;margin:0 auto 10px}
.login h1{font-size:20px;font-weight:900;margin-bottom:16px}
.login form{text-align:left}

.pk-btn{width:100%;min-height:58px;font-size:16px}
.pk-btn svg{width:22px;height:22px}
.pw-alt{margin-top:6px;text-align:left}
.pw-alt summary{cursor:pointer;color:var(--ink2);font-size:13.5px;font-weight:700;padding:10px 0;text-align:center;list-style:none}
.pw-alt summary::-webkit-details-marker{display:none}
.pk-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.pk-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--bg);border-radius:12px}
.pk-list b{display:block;font-size:14.5px}
.pk-list small{display:block;font-size:12px;color:var(--ink2)}
.tgl{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.tgl span{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background-color .25s}
.tgl span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:translate .3s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tgl input:checked+span{background:var(--leaf)}
.tgl input:checked+span::after{translate:20px 0}
.tgl input:disabled+span{opacity:.4}
</style>
</head>

</svg>

<header class="top">
  <a class="brand" href="#/home"><svg><use href="#i-mark"/></svg><span><b>SOLE SPROUT</b><small>管理画面</small></span></a>
  <span class="demo-chip" title="いまはこのブラウザの中だけに保存されます">デモ</span>
  <a class="top-link" id="shopLink" href="../" target="_blank" rel="noopener" aria-label="ショップを開く">ショップ<svg><use href="#a-ext"/></svg></a>
  <a class="top-gear" href="#/settings" aria-label="設定"><svg><use href="#a-gear"/></svg></a>
</header>

<nav class="tabs" aria-label="管理メニュー">
  <a href="#/home" data-tab="home"><svg><use href="#a-home"/></svg><span>ホーム</span></a>
  <a href="#/orders" data-tab="orders"><svg><use href="#a-list"/></svg><span>注文</span></a>
  <a href="#/ship" data-tab="ship"><svg><use href="#a-box"/></svg><span>発送</span><b class="tab-badge" id="shipBadge"></b></a>
  <a href="#/stock" data-tab="stock"><svg><use href="#a-toggle"/></svg><span>在庫</span></a>
  <a href="#/notice" data-tab="notice"><svg><use href="#a-bell"/></svg><span>通知</span></a>
</nav>

<main class="main" id="view"></main>

  'use strict';

    var on = md >= s.start[0] * 100 + s.start[1] || md <= s.end[0] * 100 + s.end[1];
    var h = '<div class="h"><h1>売り切れスイッチ</h1></div>' +
      '<div class="note-box">' + (on ? 'いまは<b>収穫期間</b>です。「販売中」の商品は、ショップで注文を受け付けます。' : 'いまは<b>収穫期間の外</b>です（' + s.start[0] + '/' + s.start[1] + '〜' + s.end[0] + '/' + s.end[1] + '）。「販売中」の商品は、ショップで「予約受付中」として注文を受けます。') +
      '<br>「今週の上限」を入れると、その数に届いた時点でショップが自動で「今週は完売」になります（月曜にリセット）。</div>';
    h += SS.products.map(function (p) {
      return '<div class="prod"><h3>' + esc(p.name) + '</h3><p class="kind">' + esc(p.kind) + '</p>' + p.variants.map(function (v, i) {
        var key = p.id + ':' + i, st = A.stockOf(p.id, i), wc = A.weekCount(p.id, i), full = st.cap != null && st.cap !== '' && wc >= +st.cap;
        return '<div class="var" data-key="' + key + '"><div class="var-h"><span>' + esc(v.label) + '</span><span class="n">' + yen(v.price) + '</span></div>' +
          '<div class="seg">' + Object.keys(A.STOCK).map(function (k) { return '<button data-s="' + k + '" class="' + (st.state === k ? 'on' : '') + '">' + A.STOCK[k] + '</button>'; }).join('') + '</div>' +
          '<div class="cap">今週の上限<input type="number" min="0" inputmode="numeric" placeholder="なし" value="' + (st.cap == null ? '' : st.cap) + '">箱<span class="now' + (full ? ' full' : '') + '">今週の受付 <b class="n">' + wc + '</b> 箱' + (full ? '・完売中' : '') + '</span></div></div>';
      }).join('') + '</div>';
    }).join('');
    view.innerHTML = h;
  }

  /* ================= 通知 ================= */
  function notice() {
    var l = A.logs();
    var ch = A.channels ? A.channels() : {};
    var h = '<div class="h"><h1>通知の記録</h1><small>' + l.length + '件</small></div>' +
      (LIVE ? '<div class="note-box">LINE：<b>' + (ch.line ? 'つながっています' : '未設定') + '</b>　メール：<b>' + (ch.mail ? 'つながっています' : '未設定') + '</b><br>テスト中のメールは、お客さんではなく村瀬さんのアドレスに届きます。</div>' +
        '<div class="btns" style="margin-bottom:12px"><button class="btn b-green" data-act="testnotify">LINEとメールにテスト送信する</button></div>'
        : '<p class="lead">本番では、緑の「LINE」は玉垣さんのLINEに、青の「メール」はお客さんに自動で届きます。いまはデモなので、届くはずの文面をここに残しています。</p>');
    h += l.length ? '<div class="nlist">' + l.map(function (n, i) {
      return '<div class="nrow" data-i="' + i + '"><header><span class="kind ' + (n.kind === 'line' ? 'k-line">LINE' : 'k-mail">メール') + '</span><span>' + fmt(n.at, true) + '</span><span>宛先：' + esc(n.to) + '</span>' + (n.sent === true ? '<span class="pill s-done">送信済み</span>' : n.sent === false ? '<span class="pill s-paid" title="' + esc(n.result) + '">未送信：' + esc(n.result).slice(0, 24) + '</span>' : n.sent === null && LIVE ? '<span class="pill s-pending">送信中</span>' : '') + '</header>' +
        '<h3>' + esc(n.title) + '</h3><pre>' + esc(n.body) + '</pre><button data-act="more">全文を見る</button></div>';
    }).join('') + '</div>' : emptyBox('まだ通知はありません', '注文が入る・発送済みにする、と記録が残ります。');
    view.innerHTML = h;
  }

  /* ================= 設定 ================= */
  function settings() {
    var c = A.conf();
    view.innerHTML = '<div class="h"><h1>設定</h1></div>' +
      '<p class="sub-h">発送元（送り状の「ご依頼主」）</p><div class="card">' +
      [['name', '名前', c.name, 'organization'], ['zip', '郵便番号', c.zip, 'postal-code'], ['addr', '住所', c.addr, 'street-address'], ['tel', '電話番号', c.tel, 'tel']].map(function (f) {
        return '<div class="field"><label for="c-' + f[0] + '">' + f[1] + '</label><input id="c-' + f[0] + '" data-c="' + f[0] + '" value="' + esc(f[2]) + '" autocomplete="' + f[3] + '"' + (f[0] === 'tel' ? ' type="tel"' : '') + '></div>';
      }).join('') + '<button class="btn b-green" data-act="saveconf" style="width:100%">保存する</button></div>' +
      '<p class="sub-h">送料表</p><div class="note-box">保留中（未決定）。決まるまで、注文の送料は「未確定」で記録し、確認の連絡でお伝えする運用です。</div>' +
      '<p class="sub-h">' + (LIVE ? 'テストの台帳' : 'デモのデータ') + '</p><div class="card stack"><p class="lead" style="margin:0">' + (LIVE ? 'いまの注文・在庫・通知は、テスト用サーバー（このMac）の台帳に保存されています。Stripeの支払い記録は消えません。' : 'いまの注文・在庫・通知は、このブラウザの中にだけ保存されています。別のスマホやPCからは見えません。') + '</p>' +
      securityCard() +
      '<div class="btns">' + (LIVE ? '' : '<button class="btn b-line" data-act="seed">サンプル注文を3件入れる</button>') + '<button class="btn b-ghost" data-act="reset">' + (LIVE ? 'テストの台帳を全部消す' : 'デモのデータを全部消す') + '</button></div></div>';
  }

  /* ================= シート ================= */
  function openSheet(html) { $('#sheet').innerHTML = html; $('#sheet').hidden = false; $('#sheetBg').hidden = false; }
  function closeSheet() { $('#sheet').hidden = true; $('#sheetBg').hidden = true; }
  $('#sheetBg').addEventListener('click', closeSheet);

  /* ================= 操作 ================= */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'seed') { A.seed(); toast('サンプル注文を3件入れました'); render(); }
    if (act === 'reset') { if (confirm('デモの注文・在庫・通知をすべて消します。よろしいですか？')) { A.reset(); sel = {}; toast('消しました'); render(); } }
    if (act === 'status') {
      var to = b.dataset.to;
      if (to === 'canceled' && !confirm('この注文をキャンセルにします。お客さんにお知らせのメールが届きます。')) return;
      A.updateOrder(view.dataset.no, { status: to }); toast(A.STATUS[to].label + 'にしました'); render();
    }
    if (act === 'shipone') trackingSheet([view.dataset.no]);
    if (act === 'csv') {
      var nos = Object.keys(sel), fname = A.shipFileName(nos);
      download(fname, A.shipCSV(nos));
      toast('「' + fname + '」をダウンロードに保存しました。開かずにB2クラウドで選んでください');
    }
    if (act === 'packsel') { Object.keys(sel).forEach(function (no) { if (A.getOrder(no).status === 'paid') A.updateOrder(no, { status: 'packed' }); }); toast('梱包済みにしました'); render(); }
    if (act === 'shipsel') trackingSheet(Object.keys(sel));
    if (act === 'doship') {
      var ok = true, rows = $$('.trk');
      rows.forEach(function (r) { var v = $('input', r).value.replace(/[^\d]/g, ''), bad = v.length !== 12; $('.err', r).hidden = !bad; r.classList.toggle('bad', bad); if (bad) ok = false; });
      if (!ok) { toast('伝票番号を確認してください'); return; }
      rows.forEach(function (r) { var no = r.dataset.no; A.updateOrder(no, { tracking: $('input', r).value.replace(/[^\d]/g, '') }); A.updateOrder(no, { status: 'shipped' }); delete sel[no]; });
      closeSheet(); toast(rows.length + '件を発送済みにして、お客さんに知らせました'); render();
    }
    if (act === 'close') closeSheet();
    if (act === 'logout') { A.logout(); toast('ログアウトしました'); render(); }
    if (act === 'logoutall') { if (confirm('すべての端末でログアウトします。よろしいですか？')) { post('/api/logout-all').then(function () { A.logout(); toast('すべての端末でログアウトしました'); render(); }); } }
    if (act === 'pknudgeoff') { sessionStorage.setItem('pk-nudge-off', '1'); render(); }
    if (act === 'pkreg') {
      b.disabled = true;
      passkeyRegister().then(function (r) {
        if (r.ok) { try { localStorage.setItem('pk-registered', '1'); } catch (e) {} toast('登録しました。次から顔・指紋でログインできます'); render(); }
        else { toast(r.error || '登録できませんでした'); b.disabled = false; }
      }).catch(function (e) { toast(pkError(e)); b.disabled = false; });
    }
    if (act === 'pkdel') {
      if (!confirm('この端末のパスキーを削除します。よろしいですか？')) return;
      post('/api/passkey/delete', { id: b.dataset.id }).then(function () { toast('削除しました'); loadSecurity(); });
    }
    if (act === 'testnotify') { A.testNotify(); toast('テスト送信しました。数秒で結果が出ます'); render(); }
    if (act === 'more') b.closest('.nrow').classList.toggle('open');
    if (act === 'saveconf') { var c = {}; $$('[data-c]').forEach(function (i) { c[i.dataset.c] = i.value.trim(); }); A.setConf(c); toast('保存しました'); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('.cb[data-no]')) { if (t.checked) sel[t.dataset.no] = 1; else delete sel[t.dataset.no]; ship(); }
    if (t.id === 'all') { waiting().forEach(function (o) { if (t.checked) sel[o.no] = 1; else delete sel[o.no]; }); ship(); }
    if (t.matches('.cap input')) {
      var key = t.closest('.var').dataset.key, v = t.value === '' ? null : Math.max(0, parseInt(t.value, 10) || 0);
      A.setStock(key, { cap: v }); toast(v == null ? '上限をなくしました' : '今週の上限を' + v + '箱にしました'); stock();
    }
  });
  view.addEventListener('click', function (e) {
    var f = e.target.closest('#fchips button'); if (f) { filter = f.dataset.f; orders(); return; }
    var s = e.target.closest('.seg button');
    if (s) { var key = s.closest('.var').dataset.key; A.setStock(key, { state: s.dataset.s }); toast(A.STOCK[s.dataset.s] + 'にしました（ショップに反映）'); stock(); }
  });

  /* ================= ログイン（パスキー＝顔・指紋／予備のパスワード） ================= */
  var b64u = function (buf) { var s = '', b = new Uint8Array(buf); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  var ub64u = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };
  var canPasskey = !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
  function post(path, body) {
    return fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function deviceName() {
    var u = navigator.userAgent;
    return /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Androidスマホ' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windowsパソコン' : 'この端末';
  }
  function passkeyLogin() {
    return post('/api/passkey/login/options').then(function (o) {
      return navigator.credentials.get({ publicKey: { challenge: ub64u(o.challenge), rpId: o.rpId, allowCredentials: [], userVerification: 'required', timeout: o.timeout } });
    }).then(function (c) {
      return post('/api/passkey/login/verify', { id: c.id, clientDataJSON: b64u(c.response.clientDataJSON), authenticatorData: b64u(c.response.authenticatorData), signature: b64u(c.response.signature) });
    });
  }
  function passkeyRegister() {
    return post('/api/passkey/register/options').then(function (o) {
      if (o.error) throw new Error(o.error === 'login' ? 'もう一度ログインしてください' : o.error);
      return navigator.credentials.create({ publicKey: {
        challenge: ub64u(o.challenge), rp: o.rp, user: { id: ub64u(o.user.id), name: o.user.name, displayName: o.user.displayName },
        pubKeyCredParams: o.pubKeyCredParams, authenticatorSelection: o.authenticatorSelection, attestation: 'none', timeout: o.timeout,
        excludeCredentials: o.excludeCredentials.map(function (e) { return { type: 'public-key', id: ub64u(e.id) }; }) } });
    }).then(function (c) {
      return post('/api/passkey/register/verify', { id: c.id, clientDataJSON: b64u(c.response.clientDataJSON), attestationObject: b64u(c.response.attestationObject), name: deviceName() });
    });
  }
  function pkError(e) {
    var m = e && e.name === 'NotAllowedError' ? 'キャンセルされました（または時間切れ）。もう一度どうぞ' :
      e && e.name === 'InvalidStateError' ? 'この端末はもう登録されています' : (e && e.message) || 'うまくいきませんでした';
    return m;
  }
  function loggedIn() { A.afterLogin(); document.body.classList.remove('locked'); toast('ログインしました'); render(); }
  function loginView() {
    document.body.classList.add('locked');
    var au = A.authInfo(), hasPk = au.passkeys > 0, pwOn = au.passwordLogin !== false;
    if (!au.hasPassword && !hasPk) {
      view.innerHTML = '<div class="login"><svg class="login-mark"><use href="#i-mark"/></svg><h1>管理画面</h1><p class="lead">ログインの準備がまだできていません。制作担当（村瀬）に連絡してください。</p></div>';
      return;
    }
    view.innerHTML = '<div class="login"><svg class="login-mark"><use href="#i-mark"/></svg><h1>管理画面にログイン</h1>' +
      (hasPk && canPasskey ? '<button class="btn b-green pk-btn" id="pkLogin"><svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1V8a5 5 0 0 0-5-5zm-3 8V8a3 3 0 0 1 6 0v3z" fill="currentColor"/></svg>顔・指紋でログイン</button>' +
        '<p class="lead" style="margin:10px 0 18px">Face ID・Touch ID・指紋・画面ロックの暗証番号が使えます</p>' : '') +
      (pwOn ? (hasPk ? '<details class="pw-alt"><summary>パスワードでログイン（予備）</summary>' : '') +
        '<form id="loginForm" class="card"><div class="field"><label for="pw">パスワード</label>' +
        '<input id="pw" type="password" autocomplete="current-password" required></div>' +
        '<button class="btn ' + (hasPk ? 'b-line' : 'b-green') + '" style="width:100%">ログイン</button></form>' + (hasPk ? '</details>' : '') : '') +
      '<p class="err" id="loginErr" hidden></p>' +
      '<p class="lead" style="margin-top:16px">この画面に入れるのは SOLE SPROUT の管理者だけです。</p></div>';
    function err(m) { var e = $('#loginErr'); e.textContent = m; e.hidden = false; }
    var pk = $('#pkLogin');
    if (pk) pk.addEventListener('click', function () {
      pk.disabled = true;
      passkeyLogin().then(function (r) { if (r.ok) loggedIn(); else { err(r.error || 'ログインできませんでした'); pk.disabled = false; } })
        .catch(function (e) { err(pkError(e)); pk.disabled = false; });
    });
    var f = $('#loginForm');
    if (f) {
      if (!hasPk) $('#pw').focus();
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var r = A.login($('#pw').value);
        if (r.ok) { document.body.classList.remove('locked'); toast('ログインしました'); render(); }
        else { err(r.error); $('#pw').value = ''; $('#pw').focus(); }
      });
    }
  }
  /* パスワードで入った端末に、パスキー登録をすすめる */
  function pkNudge() {
    if (!LIVE || !canPasskey || sessionStorage.getItem('pk-nudge-off')) return '';
    var au = A.authInfo(); if (au.passkeys > 0 && localStorage.getItem('pk-registered')) return '';
    if (localStorage.getItem('pk-registered')) return '';
    return '<div class="note-box pk-nudge"><b>次から顔・指紋だけで入れるようにしませんか？</b><br>この端末を登録すると、パスワードを打たずにワンタップでログインできます。<div class="btns" style="margin-top:10px"><button class="btn b-green" data-act="pkreg">この端末を登録する</button><button class="btn b-ghost" data-act="pknudgeoff">あとで</button></div></div>';
  }
  function securityCard() {
    if (!LIVE) return '';
    return '<p class="sub-h">ログインの方法</p><div class="card stack" id="secCard"><p class="lead" style="margin:0">読み込み中…</p></div>';
  }
  function loadSecurity() {
    var box = $('#secCard'); if (!box) return;
    fetch('/api/passkeys', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) { box.innerHTML = '<p class="lead">もう一度ログインしてください</p>'; return; }
      var ks = j.keys, au = j.auth;
      box.innerHTML = '<div><b>顔・指紋（パスキー）</b><p class="lead" style="margin:4px 0 8px">登録した端末だけが、顔か指でログインできます。</p>' +
        (ks.length ? '<ul class="pk-list">' + ks.map(function (k) {
          return '<li><span><b>' + esc(k.name) + '</b><small>登録 ' + esc(k.created) + (k.used ? '・最後に使った日 ' + esc(k.used) : '') + '</small></span><button class="btn b-ghost" data-act="pkdel" data-id="' + esc(k.id) + '">削除</button></li>';
        }).join('') + '</ul>' : '<p class="lead">まだ登録されていません</p>') +
        (canPasskey ? '<button class="btn b-green" data-act="pkreg" style="width:100%;margin-top:8px">この端末を登録する</button>' : '<p class="lead">この画面（ブラウザ）ではパスキーを使えません</p>') + '</div>' +
        '<div><b>パスワード（予備）</b><label class="tgl" style="margin:8px 0 0"><input type="checkbox" id="pwToggle"' + (au.passwordLogin ? ' checked' : '') + (ks.length ? '' : ' disabled') + '><span></span>パスワードでのログインも許可する</label>' +
        '<p class="lead" style="margin:4px 0 0">' + (ks.length ? 'オフにすると、登録した端末からしか入れなくなります（いちばん安全）。' : 'パスキーを登録すると、オフにできます。') + '</p></div>' +
        '<div class="btns"><button class="btn b-line" data-act="logout">この端末でログアウト</button><button class="btn b-ghost" data-act="logoutall">すべての端末でログアウト</button></div>';
      var t = $('#pwToggle');
      if (t) t.addEventListener('change', function () {
        post('/api/auth/settings', { passwordLogin: t.checked }).then(function (r) { if (r.error) { toast(r.error); t.checked = true; } else toast(t.checked ? 'パスワードでも入れるようにしました' : 'パスキーだけで入る設定にしました'); });
      });
    });
  }

  /* ================= 画面の切り替え ================= */
  function render() {
    if (A.needLogin && A.needLogin()) { loginView(); return; }
    document.body.classList.remove('locked');
    var h = location.hash.replace(/^#\/?/, '').split('/'), tab = h[0] || 'home';
    $$('.tabs a').forEach(function (a) { a.classList.toggle('on', a.dataset.tab === tab); });
    badge();
    if (tab === 'orders' && h[1]) detail(decodeURIComponent(h[1]));
    else ({ home: home, orders: orders, ship: ship, stock: stock, notice: notice, settings: settings }[tab] || home)();
    if (tab === 'settings') loadSecurity();
  }
  addEventListener('hashchange', function () { closeSheet(); scrollTo(0, 0); render(); });
  /* ショップで注文が入ると、開いたままの管理画面にもすぐ出る */
  A.onChange(function (k) { if (A.needLogin && A.needLogin()) { if (!$('#loginForm')) render(); return; } if ($('#sheet').hidden && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) { render(); if (/orders/.test(k)) toast('新しい動きがありました'); } });
  render();
})();
</script>
</body>
</html>
